<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <title>Гра 21</title>
    <style>
        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: linear-gradient(135deg, #e0eafc, #cfdef3);
            font-family: Arial, sans-serif;
        }
        .game {
            display: flex;
            align-items: center;
            gap: 30px;
            background: #fff;
            padding: 30px 40px;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.15);
        }
        .player {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 15px;
        }
        .score-box {
            width: 120px;
            padding: 8px;
            background: #1e90ff;
            color: #fff;
            font-size: 24px;
            font-weight: bold;
            text-align: center;
            border-radius: 8px;
        }
        .card {
            width: 100px;
            height: 140px;
            border-radius: 8px;
            border: 2px solid #333;
            object-fit: cover;
        }
        .gen-btn {
            padding: 18px 30px;
            font-size: 20px;
            font-weight: bold;
            background: #2ed573;
            color: #fff;
            border: none;
            border-radius: 12px;
            cursor: pointer;
        }
        @media (max-width: 700px) {
            .game {
                flex-direction: column;
                gap: 20px;
            }
        }
    </style>
</head>
<body>
    <div class="game">
        <div class="player">
            <h2 id="username">Гравець</h2>
            <div class="score-box" id="userO">0</div>
            <img class="card" id="userCard" alt="Карта">
        </div>

        <div>
            <p id="attemptText">Спроба 0 з 3</p>
            <button id="genBtn" class="gen-btn">Generate</button>
        </div>

        <div class="player">
            <h2>Computer</h2>
            <div class="score-box" id="computerO">0</div>
            <img class="card" id="compCard" alt="Карта">
        </div>
    </div>

    <script src="Lr9.js"></script>
</body>
</html>
